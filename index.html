<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داتابەیسی خوێندکاران - زیندەزانی</title>
    
    <script>
        // دانانی دۆخی شەو/ڕۆژ پێش نیشاندانی لاپەڕە (بۆ ئەوەی بریسکە نەکات)
        (function() {
            try {
                var m = localStorage.getItem("theme_mode") || "auto";
                var dark = m === "dark" || (m === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
                document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
            } catch (e) {}
        })();
    </script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        @font-face {
            font-family: 'GoranFont';
            src: url('GoranFontRegular-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg-gradient: linear-gradient(135deg, #0f766e 0%, #0284c7 100%);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }

        body { 
            font-family: 'GoranFont', Tahoma, sans-serif; 
            background: var(--bg-gradient); 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            color: var(--text-main); 
            box-sizing: border-box;
        }

        .container { 
            width: 100%; 
            max-width: 850px; 
            background: rgba(255, 255, 255, 0.92); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px 25px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); 
            box-sizing: border-box; 
            margin: auto; 
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .header-logo { text-align: center; margin-bottom: 15px; }
        .header-logo img { width: 105px; height: 105px; border-radius: 50%; box-shadow: 0 6px 15px rgba(0,0,0,0.15); object-fit: cover; border: 3px solid var(--primary); }
        
        h2 { text-align: center; margin-top: 0; font-weight: 700; margin-bottom: 5px; color: var(--primary); }
        .subtitle-box { text-align: center; color: var(--text-muted); margin-bottom: 25px; font-size: 14px; line-height: 1.6; }
        .subtitle-box .grade-sub { font-weight: bold; color: var(--primary); }
        .subtitle-box .school-sub { color: var(--text-main); font-weight: bold; }

        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 14px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 15px; font-family: 'GoranFont', Tahoma, sans-serif; background: rgba(255,255,255,0.8); transition: all 0.3s ease; }
        input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15); background: #ffffff; }
        
        .input-error {
            border-color: var(--danger) !important;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.15) !important;
            background: #fef2f2 !important;
        }

        button { background: linear-gradient(to right, #0284c7, #0f766e); color: white; border: none; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 15px; box-shadow: 0 6px 15px rgba(2, 132, 199, 0.25); border-radius: 14px; }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(2, 132, 199, 0.35); }
        button.btn-logout { background: linear-gradient(to right, var(--danger), #dc2626); }
        button.btn-save { background: linear-gradient(to right, var(--success), #047857); }
        button.btn-refresh { background: linear-gradient(to right, var(--warning), #d97706); margin-top: 10px; font-size: 14px; padding: 10px; }
        
        .hidden { display: none !important; }
        
        .failed-grade {
            color: var(--danger) !important;
            text-decoration: underline;
            font-weight: bold;
        }
        
        .tabs-nav { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 20px; background: #e2e8f0; padding: 6px; border-radius: 16px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; font-family: 'GoranFont', Tahoma, sans-serif; font-size: 14px; font-weight: bold; color: var(--text-muted); border-radius: 12px; cursor: pointer; transition: all 0.3s; margin: 0; box-shadow: none; }
        .tab-btn.active { background: white; color: var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.08); }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card { background: rgba(248, 250, 252, 0.7); border: 1px solid #e2e8f0; padding: 20px; border-radius: 18px; margin-bottom: 15px; }
        .card h3 { margin-top: 0; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 15px; color: #0f766e; font-size: 17px; }

        .table-responsive { overflow-x: auto; margin-bottom: 15px; }
        table { width: 100%; min-width: 400px; border-collapse: separate; border-spacing: 0; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; background: white; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background-color: #e0f2fe; color: var(--primary); }
        td:not(:last-child), th:not(:last-child) { border-left: 1px solid #e2e8f0; }
        tr:last-child td { border-bottom: none; }
        
        .profile-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; padding: 15px; background: rgba(224, 242, 254, 0.7); border-radius: 18px; border: 1px solid rgba(2, 132, 199, 0.2); }
        .profile-img { width: 75px; height: 75px; min-width: 75px; min-height: 75px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary); background: #e2e8f0; }
        
        .material-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: white; border: 1px solid #e2e8f0; border-radius: 14px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .material-link { padding: 8px 18px; background: var(--primary); color: white; text-decoration: none; border-radius: 10px; font-size: 14px; font-weight: bold; }
        .notification { background: #fee2e2; color: #b91c1c; padding: 15px; border-radius: 14px; margin-bottom: 20px; font-weight: bold; border-right: 5px solid var(--danger); }
        
        .system-footer { margin-top: 30px; margin-bottom: 20px; text-align: center; padding: 22px; color: #ffffff; font-size: 13px; line-height: 1.8; max-width: 850px; width: 100%; box-sizing: border-box; background: rgba(0, 0, 0, 0.35); backdrop-filter: blur(8px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .footer-logo { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; border: 2px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); margin-bottom: 10px; }
        .footer-single-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; opacity: 0.95; }

        #crop-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .crop-container-box { width: 90%; max-width: 400px; background: white; padding: 20px; border-radius: 20px; }
        .img-container { width: 100%; height: 350px; overflow: hidden; margin-bottom: 15px; background: #eee; border-radius: 12px; }
        .img-container img { max-width: 100%; }
        .crop-btns { display: flex; justify-content: space-between; gap: 10px; }
        .crop-btns button { margin: 0; }
        .field-label { display:block; margin-top: 12px; margin-bottom: 5px; font-size: 14px; color: var(--text-main); font-weight:bold; text-align: right; }
    
        .profile-main { flex: 1; min-width: 0; }
        .profile-main h2 { margin: 0; text-align: right; color: var(--primary); }
        .profile-main p { margin: 3px 0 0 0; color: var(--text-main); font-weight: bold; font-size: 14px; }
        .profile-details { display: flex; flex-direction: column; gap: 8px; min-width: 230px; }
        .profile-details p { margin: 0; padding: 8px 14px; background: rgba(255,255,255,0.85); border: 1px solid rgba(2,132,199,0.2); border-radius: 12px; color: var(--text-muted); font-size: 13px; font-weight: bold; }
        .profile-details p:empty { display: none; }
        @media (min-width: 700px) {
            .profile-header { padding: 18px 25px; gap: 22px; }
            .profile-img { width: 90px; height: 90px; min-width: 90px; min-height: 90px; }
            .profile-main h2 { font-size: 26px; }
            .profile-main p { font-size: 15px; margin-top: 6px; }
        }
        @media (max-width: 699px) {
            .profile-header { flex-wrap: wrap; }
            .profile-details { width: 100%; flex-direction: row; flex-wrap: wrap; min-width: 0; }
            .profile-details p { flex: 1 1 auto; text-align: center; }
        }

        .table-responsive { -webkit-overflow-scrolling: touch; }
        .scroll-hint { display: none; align-items: center; justify-content: center; gap: 8px; background: #fef3c7; color: #92400e; border: 1px solid #fde68a; border-radius: 12px; padding: 8px 12px; font-size: 13px; font-weight: bold; margin-bottom: 12px; text-align: center; }
        .scroll-hint.show { display: flex; }
        .scroll-hint .arrows { display: inline-block; font-size: 18px; animation: swipe 1.4s ease-in-out infinite; }
        @keyframes swipe { 0%, 100% { transform: translateX(-6px); } 50% { transform: translateX(6px); } }

        /* ===== کۆمپیوتەر: پانتر، کورتتر، سکرۆڵ ===== */
        .grade-block h4 { margin: 10px 0 5px !important; }
        .grades-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 18px; }
        .grade-block { min-width: 0; max-width: 100%; }
        @media (min-width: 900px) {
            body { padding: 12px 10px; }
            #dashboard-section, #footer-section { max-width: min(1250px, 96vw); }
            .grades-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
            .grades-grid table { min-width: 0; }
            .settings-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
            .settings-grid .field-wide { grid-column: 1 / -1; }

            #dashboard-section:not(.hidden) {
                display: flex; flex-direction: column;
                margin: 0 auto; padding: 18px 25px;
                max-height: calc(100vh - 118px);
            }
            #dashboard-section > * { flex-shrink: 0; }
            #dashboard-section .profile-header { margin-bottom: 12px; }
            #dashboard-section .tabs-nav { margin-bottom: 12px; }
            #dashboard-section > .tab-content.active,
            #dashboard-section > .tab-content.active { flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: thin; padding-left: 6px; }
            #dashboard-section > .btn-logout { margin-top: 12px; padding: 9px; }

            #footer-section:not(.hidden) {
                display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
                gap: 4px 28px; margin: 12px 0 0; padding: 10px 20px; line-height: 1.5;
            }
            #footer-section .footer-logo { width: 40px; height: 40px; margin: 0; }
        }

        .settings-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 18px; }
        .profile-logo-wrap { display: none; flex: 1; justify-content: center; align-items: center; }
        .profile-logo { width: 78px; height: 78px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.12); }
        /* لۆگۆ: لە کۆمپیوتەر و کاتێک مۆبایل ڕۆتەیت دەکرێت */
        @media (min-width: 700px), (orientation: landscape) {
            .profile-logo-wrap { display: flex; }
        }
        @media (orientation: landscape) and (max-height: 500px) {
            .profile-logo { width: 55px; height: 55px; }
        }

        /* ===== پرۆفایل: لۆگۆ لە ناوەڕاست ===== */
        .profile-id { display: flex; align-items: center; gap: 15px; width: 100%; min-width: 0; }
        .profile-logo-wrap { flex: none; }
        @media (min-width: 600px), (orientation: landscape) {
            .profile-header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 15px; }
            .profile-id { width: auto; gap: 22px; }
            .profile-logo-wrap { display: flex; justify-content: center; }
            .profile-details { width: auto; min-width: 0; flex-direction: column; flex-wrap: nowrap; justify-self: end; }
            .profile-details p { flex: none; text-align: right; }
        }
        /* مۆبایلی ڕۆتەیت کراو: لۆگۆ دوو ئەوەندە گەورەتر */
        @media (orientation: landscape) and (max-height: 500px) {
            .profile-logo { width: 110px; height: 110px; }
        }
        /* شاشەی پان بەڵام کورت (مۆبایلی ڕۆتەیت): حالەتی بەرزی جێگیر نەبێت */
        @media (min-width: 900px) and (max-height: 599px) {
            #dashboard-section:not(.hidden) { display: block; max-height: none; }
            #dashboard-section > .tab-content.active { overflow-y: visible; }
        }

        /* ===== بینەری ناوخۆیی بۆ PDF و ڤیدیۆ ===== */
        #viewer-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 1100; background: #0f172a; display: flex; flex-direction: column; }
        #viewer-frame { flex: 1; width: 100%; border: 0; background: #fff; }

        /* مۆبایل: دوگمەی گەڕانەوە گەورەتر و ئاسانتر بۆ پەنجە */
        #viewer-modal { height: 100%; height: 100dvh; }
        @media (max-width: 699px) {
        }

        .notification.pass { background: #dcfce7; color: #166534; border-right-color: var(--success); }

        /* ئایکۆنی باک/کردنەوە لەسەر بینەر */
        .viewer-fab { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); margin: 0; padding: 0; border: none; border-radius: 50%; background: rgba(15,23,42,0.65); color: #fff; text-decoration: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.35); }
        .viewer-fab:hover { transform: none; box-shadow: 0 2px 8px rgba(0,0,0,0.35); }
        .viewer-back { right: 12px; width: 44px; height: 44px; font-size: 22px; }
        .viewer-ext { right: 66px; top: calc(14px + env(safe-area-inset-top, 0px)); width: 36px; height: 36px; font-size: 16px; }

        /* ڕیفریش بە کێشانی شاشە */
        html, body { overscroll-behavior-y: contain; }
        #ptr-indicator { position: fixed; top: 0; left: 50%; width: 42px; height: 42px; margin-left: -21px; border-radius: 50%; background: #fff; color: var(--primary); box-shadow: 0 4px 14px rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; font-size: 22px; z-index: 1200; transform: translateY(-60px); opacity: 0; pointer-events: none; transition: transform 0.2s, opacity 0.2s; }
        #ptr-indicator.dragging { transition: none; }
        #ptr-indicator.spin span { display: inline-block; animation: ptrspin 0.8s linear infinite; }
        @keyframes ptrspin { to { transform: rotate(360deg); } }

        /* ===== حالەتی داشبۆرد: بێ گرادیەنت و بێ چینی زیادە ===== */
        body.dash-mode { background: #f1f5f9; }
        body.dash-mode #dashboard-section { background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; box-shadow: none; border: none; padding: 14px 18px; }
        body.dash-mode .card { background: transparent; border: none; padding: 0; border-radius: 0; }
        body.dash-mode .system-footer { background: var(--bg-gradient); backdrop-filter: none; -webkit-backdrop-filter: none; border: none; box-shadow: none; }
        @media (max-width: 699px) {
            body.dash-mode { padding: 0; }
            body.dash-mode #dashboard-section { max-width: none; width: 100%; margin: 0; border-radius: 0; padding: 10px 8px; }
            body.dash-mode .system-footer { max-width: none; width: 100%; margin: 12px 0 0; border-radius: 0; }
            body.dash-mode table { min-width: 0; }
            body.dash-mode th, body.dash-mode td { padding: 9px 4px; font-size: 13px; }
        }

        /* ===== تابەکان: شوشەیی (Glass) ===== */
        body.dash-mode {
            background-color: #f1f5f9;
            background-image: radial-gradient(circle at 12% 0%, rgba(15,118,110,0.20), transparent 42%), radial-gradient(circle at 92% 8%, rgba(2,132,199,0.22), transparent 40%);
            background-attachment: fixed;
        }
        .tabs-nav {
            background: linear-gradient(135deg, rgba(255,255,255,0.65), rgba(255,255,255,0.25));
            backdrop-filter: blur(16px) saturate(170%); -webkit-backdrop-filter: blur(16px) saturate(170%);
            border: 1px solid rgba(255,255,255,0.7);
            box-shadow: 0 8px 24px rgba(2,132,199,0.15), inset 0 1px 0 rgba(255,255,255,0.8);
        }
        .tab-btn.active {
            background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(255,255,255,0.6));
            border: 1px solid rgba(255,255,255,0.9);
            box-shadow: 0 4px 14px rgba(2,132,199,0.2), inset 0 1px 0 #fff;
        }
        @media (max-width: 699px) {
            .tabs-nav { position: sticky; top: calc(6px + env(safe-area-inset-top, 0px)); z-index: 60; }
        }

        /* ===== دوگمەی دۆخی شەو/ڕۆژ ===== */
        #theme-toggle { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; width: 40px; height: 40px; margin: 0; padding: 0; border-radius: 50%; font-size: 18px; line-height: 1; z-index: 900; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.7); box-shadow: 0 4px 14px rgba(0,0,0,0.18); color: inherit; }
        #theme-toggle:hover { transform: none; box-shadow: 0 4px 14px rgba(0,0,0,0.18); }
        #theme-toast { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: 58px; padding: 8px 14px; border-radius: 12px; background: rgba(15,23,42,0.88); color: #fff; font-size: 13px; z-index: 900; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
        #theme-toast.show { opacity: 1; }

        /* ===== دۆخی شەو ===== */
        html[data-theme="light"] { color-scheme: light; }
        html[data-theme="dark"] { color-scheme: dark; --text-main: #e2e8f0; --text-muted: #94a3b8; --primary: #38bdf8; --bg-gradient: linear-gradient(135deg, #04302d 0%, #0a3552 100%); }
        html[data-theme="dark"] body.dash-mode {
            background-color: #0b1220;
            background-image: radial-gradient(circle at 12% 0%, rgba(20,184,166,0.18), transparent 42%), radial-gradient(circle at 92% 8%, rgba(56,189,248,0.18), transparent 40%);
        }
        html[data-theme="dark"] .container { background: rgba(15,23,42,0.88); border-color: rgba(255,255,255,0.08); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
